<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cássio Lima — Data Scientist</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-screen-label="Website">
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="chrome.jsx"></script>
<script type="text/babel" src="views.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

function readHash() {
  const h = (window.location.hash || '#home').slice(1);
  return ['home','papers','cv','contact'].includes(h) ? h : 'home';
}

function App() {
  const [view, setView] = useState(readHash());

  useEffect(() => {
    const onHash = () => setView(readHash());
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  function nav(id) {
    window.location.hash = id;
    setView(id);
    window.scrollTo({ top: 0, behavior: 'auto' });
  }

  let content;
  if (view === 'home')    content = <HomeView onNav={nav}/>;
  else if (view === 'papers')  content = <PapersView/>;
  else if (view === 'cv')      content = <CVView/>;
  else                         content = <ContactView/>;

  return (
    <>
      <Nav active={view} onNav={nav}/>
      <div data-screen-label={view}>{content}</div>
      <Footer/>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('app'));
root.render(<App/>);
</script>
</body>
</html>
